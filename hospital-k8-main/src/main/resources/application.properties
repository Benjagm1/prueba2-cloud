spring.application.name=hospital

# Conexión a AWS RDS PostgreSQL (permite variables de entorno en Lambda o usa tu RDS por defecto)
spring.datasource.url=${DB_URL:jdbc:postgresql://database-1.c6dzqeh48dia.us-east-1.rds.amazonaws.com:5432/postgres}
spring.datasource.username=${DB_USER:postgres_colegio}
spring.datasource.password=${DB_PASS:Admin123456!}
spring.datasource.driver-class-name=org.postgresql.Driver

# Seguridad - AWS Cognito
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_JEV8rmnsH
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_JEV8rmnsH/.well-known/jwks.json

# Configuración JPA / Hibernate para PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true   
springdoc.swagger-ui.path=/doc/swagger-ui.html

# ==============================================================
# CONFIGURACIÓN RABBITMQ (EVALUACIÓN 3)
# ==============================================================
# Conexión al broker (por defecto localhost si no hay variables de entorno)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}

# RÚBRICA: Manejo explícito de errores y ACK (Manual)
spring.rabbitmq.listener.simple.acknowledge-mode=manual

# RÚBRICA: Nombres centralizados (No hardcodear en el código)
rabbitmq.exchanges.hospital=hospital.exchange
rabbitmq.queues.notifications=hospital.notifications.queue
rabbitmq.queues.notifications-dlq=hospital.notifications.dlq
rabbitmq.routing-keys.notifications=routing.notifications
rabbitmq.routing-keys.notifications-dlq=routing.notifications.dlq